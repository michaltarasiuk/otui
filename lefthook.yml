pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true

    - name: format
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: images
      glob: "*.png"
      run: oxipng -o max --strip safe -q {staged_files}
      fail_text: "Install oxipng: brew install oxipng"
      stage_fixed: true

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck

commit-msg:
  jobs:
    - name: subject
      skip: [merge]
      env:
        PATTERN: "(feat|fix|refactor|test|docs|chore): [a-z].*[^.]|Revert .*"
      run: head -n 1 {1} | grep -qxE "$PATTERN"
      fail_text: >-
        Use '<type>: <subject>' with a type of feat, fix, refactor, test, docs
        or chore, a lowercase first letter, no scope and no trailing period.
